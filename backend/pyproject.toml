[project]
name = "meridian-backend"
version = "0.1.0"
description = "Meridian Assist backend: FastAPI API, database, auth, and security core"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "slowapi>=0.1.9",
    "secure>=0.3.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "pydantic[email]>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's Depends(...)-in-default-argument is the framework's own idiom, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
