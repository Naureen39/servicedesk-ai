[project]
name = "meridian-service-ai"
version = "0.1.0"
description = "Meridian Assist: AI chat and voice customer support platform for automotive service centers"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "requests>=2.32",
    "faker>=25.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.9",
    "tqdm>=4.66",
    "psycopg[binary]>=3.1",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "pgvector>=0.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["dataset/scripts/tests"]
